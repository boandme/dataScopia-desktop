name: Build Windows desktop app

# Pulls the app's source fresh from the main repo (boandme/dataScopia, which also runs the hosted
# web version via Render) on every run, builds the standalone Windows app from it, and attaches
# it to a GitHub Release on THIS repo whenever a version tag is pushed here - e.g.
# `git tag v1.0 && git push origin v1.0`. There is deliberately no copy of the app's source in
# this repo to keep in sync - whatever is on the main repo's main branch is what gets built.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch/tag/commit of boandme/dataScopia to build from"
        default: "main"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out this repo (packaging config)
        uses: actions/checkout@v4

      - name: Check out the app's source
        uses: actions/checkout@v4
        with:
          repository: boandme/dataScopia
          ref: ${{ inputs.source_ref || 'main' }}
          path: source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source/requirements.txt -r source/requirements-desktop.txt pyinstaller>=6.22.0

      - name: Build with PyInstaller
        run: pyinstaller packaging/datascopia.spec --clean --distpath dist_desktop --workpath build_desktop -y
        env:
          DATASCOPIA_SOURCE: ${{ github.workspace }}\source

      - name: Zip the build
        run: Compress-Archive -Path dist_desktop/DataScopia -DestinationPath DataScopia-windows.zip

      - name: Smoke test (as a real downloaded-and-extracted copy, on a clean runner)
        shell: pwsh
        run: |
          # This is what actually caught the "Failed to resolve Python.Runtime.Loader.Initialize"
          # bug (v1.1): that only ever reproduced from a genuinely downloaded-and-extracted copy,
          # never from a build run in place - because Windows tags files extracted from a
          # downloaded ZIP with "Mark of the Web", and that's what broke pythonnet's assembly
          # loading. Testing the raw dist_desktop/ folder wouldn't catch that class of bug again;
          # this reproduces the real condition every time, on a fresh runner with no dev tools
          # installed (unlike a developer's own machine, which can mask this exact failure).
          Set-Content -Path "DataScopia-windows.zip:Zone.Identifier" -Value "[ZoneTransfer]`r`nZoneId=3" -Encoding ASCII
          $extractDir = "smoketest_extract"
          Expand-Archive -Path DataScopia-windows.zip -DestinationPath $extractDir
          Get-ChildItem -Path $extractDir -Recurse -File | ForEach-Object {
            Set-Content -Path "$($_.FullName):Zone.Identifier" -Value "[ZoneTransfer]`r`nZoneId=3" -Encoding ASCII
          }

          $proc = Start-Process -FilePath "$extractDir\DataScopia\DataScopia.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Error "DataScopia.exe exited on startup (exit code $($proc.ExitCode)) - see the job summary above for what changed since the last working release."
            exit 1
          }
          try {
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/datasets/demo" -UseBasicParsing -TimeoutSec 10
            if ($response.StatusCode -ne 200) {
              Write-Error "Server responded with unexpected status $($response.StatusCode)"
              exit 1
            }
            Write-Output "Smoke test passed: DataScopia.exe started from a downloaded-and-extracted copy and served the demo dataset."
          } catch {
            Write-Error "Server on port 8000 never responded: $_"
            exit 1
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: DataScopia-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: DataScopia-windows
          path: DataScopia-windows.zip
